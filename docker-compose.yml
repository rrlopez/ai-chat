services:
  # --- Reverse Proxy ---
  nginx:
    image: nginx:alpine
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - n8n
      - rocketchat

  # --- ngrok Tunnel ---
  ngrok:
    image: ngrok/ngrok:latest
    restart: always
    env_file: .env.ngrok
    command: http --url=https://marx-hydromechanical-counterproductively.ngrok-free.dev nginx:80
    depends_on:
      - nginx

  # --- Rocket.Chat Services ---
  mongodb:
    image: mongo:5.0
    restart: always
    hostname: mongodb
    volumes:
      - mongodb_data:/data/db
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-init-replica:
    image: mongo:5.0
    depends_on:
      mongodb:
        condition: service_healthy
    command: >
      bash -c "for i in {1..30}; do
        mongo --host mongodb:27017 --eval \"rs.initiate({_id:'rs0', members:[{_id:0, host:'mongodb:27017'}]})\" && break || sleep 2;
      done"

  rocketchat:
    image: registry.rocket.chat/rocketchat/rocket.chat:latest
    restart: always
    volumes:
      - rocketchat_uploads:/app/uploads
    env_file: .env.rocketchat
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init-replica:
        condition: service_completed_successfully

  # --- n8n Automation ---
  postgres:
    image: postgres:14
    restart: always
    env_file: .env.postgres
    volumes:
      - n8n_db_data:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n:latest
    restart: always
    env_file: .env.n8n
    volumes:
      - n8n_app_data:/home/node/.n8n
    depends_on:
      - postgres

# --- PROTECTED VOLUMES SECTION ---
volumes:
  mongodb_data:
    external: true
  rocketchat_uploads:
    external: true
  n8n_db_data:
    external: true
  n8n_app_data:
    external: true